name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: dbflow
          POSTGRES_PASSWORD: dbflow_local_only
          POSTGRES_DB: dbflow_reliability_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbflow -d dbflow_reliability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run API tests
        run: npm run test --workspace @idp/api

      - name: Run PostgreSQL integration workflows
        run: npm run test:integration
        env:
          DBFLOW_TEST_DATABASE_URL: postgresql://dbflow:dbflow_local_only@127.0.0.1:5432/dbflow_reliability_test?sslmode=disable

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
